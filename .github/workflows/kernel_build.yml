name: Build Kernel Poco F4 (Munch)

# Pemicu manual biar lo bisa klik "Run workflow" langsung dari browser Android lo
on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-latest
    
    steps:
      - name: Siapkan Dependencies Mesin
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
          
      - name: Clone Kernel Source
        run: |
          echo "[*] Menarik Source ShinjiKernel..."
          git clone --depth=1 https://github.com/Harukiansyah/ShinjiKernel_Munch_SM8250.git -b main kernel-source
          
      - name: Setup Neutron Clang
        run: |
          echo "[*] Mengunduh Neutron Clang..."
          mkdir -p clang && cd clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S=30062026
          
      - name: Inject KernelSU-Next (Legacy)
        run: |
          echo "[*] Injecting KernelSU-Next..."
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          
      - name: Mulai Kompilasi Kernel
        run: |
          # GITHUB_WORKSPACE adalah path absolut dari runner Github
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          cd kernel-source
          
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="PocoF4_Builder"
          export KBUILD_BUILD_HOST="GitHubActions"
          
          echo "[*] Konfigurasi defconfig..."
          make O=out CC=clang munch_defconfig 
          
          echo "[*] Proses Build Utama Berjalan..."
          make O=out \
              ARCH=arm64 \
              CC=clang \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              -j$(nproc --all)
              
      - name: Upload Hasil Build (Artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image-Munch
          # Upload Image dan Image.gz sekalian
          path: kernel-source/out/arch/arm64/boot/Image*
          
